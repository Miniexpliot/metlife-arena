openapi: 3.0.0
info:
  title: MetLife Arena Operational API
  version: 1.0.0
  description: Real-time operational intelligence API for stadium details, concessions, and wait times.
servers:
  - url: http://localhost:3000/api
    description: Local development server
paths:
  /stadium:
    get:
      summary: Get full stadium database
      description: Returns the entire stadium document containing sectors, concessions, gate statuses, and emergency info.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StadiumData'
        '401':
          description: Unauthorized (Missing or invalid API key)
        '500':
          description: Server Error (Database unavailable)
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    StadiumData:
      type: object
      properties:
        stadiumName:
          type: string
        sectors:
          type: array
          items:
            $ref: '#/components/schemas/Sector'
        gateStatus:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GateStatus'
        emergencyInfo:
          type: object
          properties:
            emergencyNumber:
              type: string
            evacuationAssemblyPoints:
              type: string
            rules:
              type: array
              items:
                type: string
    Sector:
      type: object
      properties:
        id:
          type: string
        description:
          type: object
          properties:
            en:
              type: string
        gates:
          type: array
          items:
            type: string
        concessions:
          type: array
          items:
            $ref: '#/components/schemas/Concession'
    GateStatus:
      type: object
      properties:
        status:
          type: string
        securityWaitMinutes:
          type: integer
        crowdDensity:
          type: string
    Concession:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        cuisine:
          type: string
        waitTimeMinutes:
          type: integer
        crowdStatus:
          type: string
